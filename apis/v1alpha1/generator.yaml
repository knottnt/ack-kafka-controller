ignore:
  resource_names:
    #- Cluster
    # - ClusterV2
    - VpcConnection
    - Replicator
    #- Configuration
  field_paths:
   - ConnectivityInfo.VpcConnectivity
   - DescribeClusterOutput.ClusterInfo.BrokerNodeGroupInfo.ZoneIds
operations:
  CreateClusterV2:
    operation_type:
    - Create
    resource_name: ServerlessCluster
  DescribeClusterV2:
    operation_type:
    - Get
    resource_name: ServerlessCluster
resources:
  Configuration:
    tags:
      ignore: true
    hooks:
      sdk_read_one_post_set_output:
        template_path: hooks/configuration/sdk_read_one_post_set_output.go.tpl
  Topic:
    tags:
      ignore: true
    renames:
      operations:
        CreateTopic:
          input_fields:
            TopicName: Name
          output_fields:
            TopicName: Name
        DescribeTopic:
          input_fields:
            TopicName: Name
          output_fields:
            TopicName: Name
        UpdateTopic:
          input_fields:
            TopicName: Name
          output_fields:
            TopicName: Name
        DeleteTopic:
          input_fields:
            TopicName: Name
          output_fields:
            TopicName: Name
    synced:
      when:
        - path: Status.Status
          in:
            - ACTIVE
    exceptions:
      terminal_codes:
        - BadRequestException
    update_operation:
      # UpdateTopic rejects an optional field re-sent at its current value
      # (e.g. an unchanged PartitionCount -> "Topic already has N partitions").
      # Only send optional Spec fields (Configs, PartitionCount) that actually
      # changed; the required ClusterArn/TopicName are always sent.
      omit_unchanged_fields: true
    # UpdateTopic is async (ACTIVE -> UPDATING -> ACTIVE) and MSK rejects an
    # update issued while the topic is not ACTIVE. Requeue until it is ACTIVE so
    # an in-flight update can finish before the next one is attempted.
    updateable:
      when:
        - path: Status.Status
          in:
            - ACTIVE
    hooks:
      delta_post_compare:
        code: customPostCompare(delta, a, b)
    fields:
      Name:
        is_primary_key: true
        is_immutable: true
      ClusterArn:
        is_immutable: true
        references:
          resource: Cluster
          path: Status.ACKResourceMetadata.ARN
      ReplicationFactor:
        is_immutable: true
      # DescribeTopic returns the FULL effective topic configuration (all
      # defaults merged in), while the user only supplies the subset of keys
      # they want to override. A naive string compare therefore always differs,
      # producing a perpetual phantom delta that fires a spurious UpdateTopic
      # (which also re-sends the unchanged PartitionCount and is rejected by MSK
      # as a terminal BadRequestException). Disable the generated string compare
      # here; the customPostCompare delta_post_compare hook instead performs a
      # semantic, key-by-key comparison so genuine Configs changes are still
      # detected and reconciled.
      Configs:
        compare:
          is_ignored: true
      TopicArn:
        is_arn: true
  Cluster:
    renames:
      operations:
        CreateCluster:
          input_fields:
            ClusterName: Name
        DescribeCluster:
          input_fields:
            ClusterName: Name
    hooks:
      sdk_read_one_post_set_output:
        template_path: hooks/cluster/sdk_read_one_post_set_output.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/cluster/sdk_create_post_set_output.go.tpl
      sdk_delete_pre_build_request:
        template_path: hooks/cluster/sdk_delete_pre_build_request.go.tpl
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
      delta_post_compare:
        code: customPostCompare(delta, a, b)
    update_operation:
      custom_method_name: customUpdate
    synced:
      when:
        - path: Status.State
          in:
            - ACTIVE
    exceptions:
      terminal_codes:
        - BadRequestException
    fields:
      Rebalancing:
        late_initialize:
          skip_incomplete_check: {}
      # In order to support associating zero or more scram secrets to a cluster, we use
      # custom update code path that uses the BatchAssociate/BatchDisassociateScramSecret API
      # calls to manage the set of SecretARNs associated to this Cluster.
      AssociatedScramSecrets:
        type: "[]*string"
        references:
          resource: Secret
          service_name: secretsmanager
          path: Status.ACKResourceMetadata.ARN
      BrokerNodeGroupInfo.ClientSubnets:
        references:
          service_name: ec2
          resource: Subnet
          path: Status.SubnetID
      BrokerNodeGroupInfo.SecurityGroups:
        references:
          service_name: ec2
          resource: SecurityGroup
          path: Status.ID
      BrokerNodeGroupInfo.ConnectivityInfo.PublicAccess.Type:
        go_tag: json:"type,omitempty"
      ZookeeperConnectString:
        type: string
        is_read_only: true
      ZookeeperConnectStringTls:
        type: string
        is_read_only: true
      BootstrapBrokerString:
        type: string
        is_read_only: true
      BootstrapBrokerStringPublicSaslIam:
        type: string
        is_read_only: true
      BootstrapBrokerStringPublicSaslScram:
        type: string
        is_read_only: true
      BootstrapBrokerStringPublicTls:
        type: string
        is_read_only: true
      BootstrapBrokerStringSaslIam:
        type: string
        is_read_only: true
      BootstrapBrokerStringSaslScram:
        type: string
        is_read_only: true
      BootstrapBrokerStringTls:
        type: string
        is_read_only: true
      BootstrapBrokerStringVpcConnectivitySaslIam:
        type: string
        is_read_only: true
      BootstrapBrokerStringVpcConnectivitySaslScram:
        type: string
        is_read_only: true
      BootstrapBrokerStringVpcConnectivityTls:
        type: string
        is_read_only: true
      CurrentVersion:
        from:
          operation: DescribeCluster
          path: ClusterInfo.CurrentVersion
        is_read_only: true
  ServerlessCluster:
    is_arn_primary_key: true
    renames:
      operations:
        CreateClusterV2:
          input_fields:
            ClusterName: Name
          output_fields:
            ClusteName: Name
            ClusterType: Type
        DescribeClusterV2:
          input_fields:
          output_fields:
            ClusterName: Name
            ClusterType: Type
    fields:
      AssociatedScramSecrets:
        type: "[]*string"
        references:
          resource: Secret
          service_name: secretsmanager
          path: Status.ACKResourceMetadata.ARN
      Provisioned.BrokerNodeGroupInfo.ClientSubnets:
        references:
          service_name: ec2
          resource: Subnet
          path: Status.SubnetID
      ClusterARN:
        is_arn: true
      CurrentVersion:
        from:
          operation: DescribeCluster
          path: ClusterInfo.CurrentVersion
        is_read_only: true
      Type:
        go_tag: json:"type,omitempty"
      Provisioned.BrokerNodeGroupInfo:
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.BrokerNodeGroupInfo.BrokerAZDistribution:
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.BrokerNodeGroupInfo.ConnectivityInfo:
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.BrokerNodeGroupInfo.ConnectivityInfo.PublicAccess:
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.BrokerNodeGroupInfo.ConnectivityInfo.PublicAccess.Type:
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.BrokerNodeGroupInfo.SecurityGroups:
        references:
          service_name: ec2
          resource: SecurityGroup
          path: Status.ID
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.BrokerNodeGroupInfo.StorageInfo:
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.BrokerNodeGroupInfo.StorageInfo.EBSStorageInfo:
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.BrokerNodeGroupInfo.StorageInfo.EBSStorageInfo.VolumeSize:
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.ClientAuthentication:
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.EncryptionInfo:
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.EnhancedMonitoring:
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.OpenMonitoring:
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.StorageMode:
        late_initialize:
          skip_incomplete_check: {}
      Provisioned.Rebalancing:
        late_initialize:
          skip_incomplete_check: {}
    hooks:
      sdk_read_one_post_set_output:
        template_path: hooks/serverless_cluster/sdk_read_one_post_set_output.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/serverless_cluster/sdk_create_post_set_output.go.tpl
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
    update_operation:
      custom_method_name: customUpdate
    delete_operation:
      custom_method_name: customDelete
    synced:
      when:
        - path: Status.State
          in:
            - ACTIVE
